{% if internamentos %}
<div class="table-responsive mt-2">
  <table class="table table-sm table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Entrada</th>
        <th>Alta</th>
        <th>Dias</th>
      </tr>
    </thead>
    <tbody>
      {% for i in internamentos %}
      <tr>
        <td>{{ i.entrada|date:"d/m/Y" }}</td>
        <td>{{ i.alta|date:"d/m/Y" }}</td>
        <td>{{ i.dias }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% if gantt_int_b64 %}
<div class="mt-3">
  <img src="data:image/png;base64,{{ gantt_int_b64 }}" class="img-fluid w-100" alt="Linha do tempo Internamentos">
</div>
{% endif %}

{% else %}
<p class="text-muted mt-3">Sem internamentos (≥ 3 dias) registrados para este paciente.</p>
{% endif %}
