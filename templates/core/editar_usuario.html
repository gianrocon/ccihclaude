{% extends "base.html" %}
{% block title %}Editar Usuário — CCIH{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="d-flex align-items-center gap-2 mb-3">
      <a href="{% url 'gerenciar_usuarios' %}" class="btn btn-outline-secondary btn-sm">← Voltar</a>
      <h5 class="mb-0 text-primary fw-bold">Editar: {{ usuario.username }}</h5>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Hospital</label>
            <select name="hospital" class="form-select">
              <option value="">— Sem hospital —</option>
              {% for h in hospitais %}
              <option value="{{ h.pk }}" {% if usuario.hospital_id == h.pk %}selected{% endif %}>
                {{ h.sigla }} — {{ h.nome }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Papel</label>
            <select name="papel" class="form-select">
              <option value="consultor" {% if usuario.papel == "consultor" %}selected{% endif %}>Consultor</option>
              <option value="carregador" {% if usuario.papel == "carregador" %}selected{% endif %}>Carregador</option>
            </select>
            <div class="form-text">
              <strong>Consultor:</strong> apenas consulta dados.<br>
              <strong>Carregador:</strong> consulta, importa arquivos e pode limpar o banco.
            </div>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input type="checkbox" name="ativo" value="1" id="id_ativo" class="form-check-input"
                     {% if usuario.is_active %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="id_ativo">Usuário ativo</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="{% url 'gerenciar_usuarios' %}" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
