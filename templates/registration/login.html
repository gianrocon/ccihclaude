<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCIH — Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #e3f2fd; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 380px; }
    .login-header { background: #1565c0; color: #fff; border-radius: 8px 8px 0 0; padding: 1.5rem; text-align: center; }
    .login-header h4 { margin: 0; font-weight: 700; letter-spacing: 1px; }
    .login-header small { opacity: .8; }
  </style>
</head>
<body>
<div class="login-card shadow">
  <div class="login-header">
    <h4>CCIH</h4>
    <small>Controle de Infecção Hospitalar</small>
  </div>
  <div class="card-body bg-white rounded-bottom p-4">
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuário</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
